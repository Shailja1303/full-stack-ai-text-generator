<!DOCTYPE html>
<html>
<head>
    <title>Full Stack AI Text Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🤖 Full Stack AI Text Generator</h1>
    <p>Generate AI-powered text responses using Hugging Face Transformers.</p>

<textarea
    id="prompt"
    rows="6"
    cols="50"
    placeholder="Ask a question or enter a prompt...">
</textarea>

    <br><br>

    <button id="generateBtn" onclick="generateText()">
    Generate AI Response
    </button>

    <h3>Generated Text</h3>

    <p id="output">Your AI-generated response will appear here.</p>

</div>

<script src="script.js"></script>

</body>
</html>
